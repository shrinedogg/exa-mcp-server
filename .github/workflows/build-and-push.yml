name: build-and-push
on:
  push:
    branches: [main]
    paths:
      - VERSION
      - Dockerfile
      - Dockerfile.http
      - package.json
      - package-lock.json
      - src/**
      - tsconfig.json
      - .github/workflows/build-and-push.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: v
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push stdio image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            shrinedogg/exa-mcp-server:latest
            shrinedogg/exa-mcp-server:${{ steps.v.outputs.version }}

      - name: Build and push HTTP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.http
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            shrinedogg/exa-mcp-server-http:latest
            shrinedogg/exa-mcp-server-http:${{ steps.v.outputs.version }}

      - name: Verify stdio manifests
        run: |
          docker buildx imagetools inspect \
            shrinedogg/exa-mcp-server:${{ steps.v.outputs.version }} | grep -E 'linux/(amd64|arm64)'

      - name: Verify HTTP manifests
        run: |
          docker buildx imagetools inspect \
            shrinedogg/exa-mcp-server-http:${{ steps.v.outputs.version }} | grep -E 'linux/(amd64|arm64)'

      - name: Smoke run stdio (amd64)
        run: |
          docker run --rm --platform linux/amd64 \
            -e EXA_API_KEY=dummy \
            shrinedogg/exa-mcp-server:${{ steps.v.outputs.version }} --help 2>&1 || true

      - name: Smoke run HTTP (amd64)
        run: |
          # HTTP server starts immediately (no --help flag) so just verify it boots
          timeout 5 docker run --rm --platform linux/amd64 \
            -e EXA_API_KEY=dummy \
            shrinedogg/exa-mcp-server-http:${{ steps.v.outputs.version }} 2>&1 || true

      - name: Tag repo for reproducibility
        run: |
          tag="${{ steps.v.outputs.version }}"
          if ! git ls-remote --tags origin | grep -q "refs/tags/$tag"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$tag"
            git push origin "$tag"
          fi
